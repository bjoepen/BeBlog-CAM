[package]
name = "beblog-cam"
version = "0.1.0-alpha.1"
description = "Focused 3-axis CAM for makers"
authors = ["BeBlog CAM"]
edition = "2021"

[lib]
name = "beblog_cam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
occt-native = []

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
dxf = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
