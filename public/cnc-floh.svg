<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 150" role="img" aria-labelledby="title desc">
  <title id="title">BeBlog CNC Floh mit Lupe</title>
  <desc id="desc">Freundlicher kleiner CNC Floh mit Kappe, Fräser und Lupe</desc>
  <g stroke="#242b27" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs -->
    <g fill="none">
      <path d="M63 90 40 99 27 96"/>
      <path d="M63 99 43 117 31 120"/>
      <path d="M69 106 61 129 50 135"/>
      <path d="M105 91 124 80 138 81"/>
      <path d="M108 99 128 109 141 111"/>
      <path d="M101 108 112 131 123 136"/>
    </g>

    <!-- body -->
    <ellipse cx="84" cy="88" rx="31" ry="39" fill="#343a36"/>
    <path d="M57 80c14 7 40 7 54 0M56 94c15 7 42 7 56 0M63 107c11 5 31 5 42 0" fill="none" opacity=".55"/>

    <!-- head -->
    <ellipse cx="83" cy="57" rx="27" ry="24" fill="#f9f9f4"/>

    <!-- cap -->
    <path d="M57 45c7-16 29-21 46-10 3 2 6 5 8 8-18-3-36 0-54 2Z" fill="#778d70"/>
    <path d="M99 39c12-2 20 2 24 7-9 2-16 2-24 0Z" fill="#778d70"/>
    <text x="72" y="41" font-size="9" font-family="system-ui, sans-serif" fill="#242b27" stroke="none" font-weight="700">CNC</text>

    <!-- face -->
    <ellipse cx="73" cy="55" rx="8" ry="9" fill="#fff"/>
    <ellipse cx="94" cy="55" rx="8" ry="9" fill="#fff"/>
    <circle cx="76" cy="57" r="3" fill="#242b27" stroke="none"/>
    <circle cx="91" cy="57" r="3" fill="#242b27" stroke="none"/>
    <path d="M70 69c8 8 19 8 27 0" fill="none"/>
    <path d="M81 64c2 2 5 2 7 0" fill="none"/>

    <!-- left arm + cutter -->
    <path d="M58 78 39 73 29 65" fill="none"/>
    <g transform="translate(12 50) rotate(-22 17 18)">
      <rect x="11" y="4" width="10" height="31" rx="2" fill="#d9ddd7"/>
      <path d="M12 8h8M12 14l8 5M12 20l8 5M12 26l8 5" fill="none"/>
      <path d="M16 35v9" fill="none"/>
    </g>

    <!-- right arm + magnifier -->
    <path d="M107 77 124 68 134 60" fill="none"/>
    <circle cx="143" cy="51" r="18" fill="#fff" fill-opacity=".55"/>
    <circle cx="143" cy="51" r="13" fill="#edf4f7" fill-opacity=".7"/>
    <path d="m155 64 15 17" fill="none"/>

    <!-- tiny highlights -->
    <path d="M137 44c3-4 7-5 10-5" fill="none" opacity=".55"/>
  </g>
</svg>