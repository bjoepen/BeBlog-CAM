name: Patch 004M UI copy
on:
  push:
    branches:
      - agent/beblog-cam-004m-step-pocket-complete
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004m-step-pocket-complete
      - name: Update 004M pocket copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.svelte')
          s = p.read_text()
          s = s.replace(
            'Automatisch wählt Kreis für native DXF-Kreise, Raster für achsparallele Rechtecke und Konturparallel für unterstützte gemischte LINE/ARC-Konturen.',
            "Automatisch wählt für DXF weiterhin die passende 2D-Strategie; bei STEP wird eine insellose BRep-Tasche konzentrisch und eine Region mit Inseln konturparallel bearbeitet."
          )
          s = s.replace(
            'Die lineare Rampe bleibt dem bewiesenen Rasterpfad vorbehalten.',
            "Die lineare Rampe wird bei STEP gegen Rampenwinkel und verfügbare sichere Bahnlänge geprüft. Ist der Winkel geometrisch nicht erreichbar, wird die Bearbeitung gesperrt."
          )
          s = s.replace(
            'Helix ist bewusst nur für native Kreistaschen freigegeben. Der Schaftfräser fährt auf einer G3-Helix auf die jeweilige Schnitttiefe; danach wird die Tasche konzentrisch von innen nach außen geräumt.',
            "Bei STEP wird die G3-Helix nur freigegeben, wenn in der werkzeugradiusbereinigten Taschenregion ein kollisionsfreier Helixkreis nachgewiesen werden kann. Andernfalls wird kein unsicherer Fallback erzeugt."
          )
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.svelte
          git diff --cached --quiet || git commit -m "docs(ui): align STEP pocket hints with 004M"
          git push
