name: 004I targeted patch
on:
  push:
    branches: [agent/beblog-cam-004i-contour-tabs]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '004i-patch:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004i-contour-tabs
      - name: Patch STEP, UI, gate and docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/lib/stepContourOperation.ts'); s=p.read_text()
          if "from './contourTabs'" not in s:
            s=s.replace("import { resolveContourDepth } from './contourDepth';", "import { resolveContourDepth } from './contourDepth';\nimport { applyContourTabs } from './contourTabs';")
            old="return{ok:true,toolpath:{version:1,operationKind:'contour',strategy:'contour',tool:{diameterMm:operation.tool.diameterMm},stepoverPercent:0,runs},errors:[],warnings,candidates:all,selected:chosen};"
            new="const baseToolpath:CanonicalToolpath={version:1,operationKind:'contour',strategy:'contour',tool:{diameterMm:operation.tool.diameterMm},stepoverPercent:0,runs};const tabbed=applyContourTabs(baseToolpath,operation,depth.depthMm);errors.push(...tabbed.errors);warnings.push(...tabbed.warnings);if(errors.length)return{ok:false,toolpath:null,errors,warnings,candidates:all,selected:chosen};return{ok:true,toolpath:tabbed.toolpath,errors:[],warnings,candidates:all,selected:chosen};"
            assert old in s
            s=s.replace(old,new,1); p.write_text(s)

          p=Path('src/App.svelte'); s=p.read_text()
          if 'updateContourTabCount' not in s:
            anchor="  function updateContourOvercut(event:Event){if(operation.kind!=='contour')return;const value=Number((event.currentTarget as HTMLInputElement).value);if(Number.isFinite(value)&&value>=0)updateContour({overcutMm:value});}\n"
            add=anchor+"  function updateContourTabCount(event:Event){if(operation.kind!=='contour')return;const value=Math.floor(Number((event.currentTarget as HTMLInputElement).value));if(Number.isFinite(value)&&value>=1)updateContour({tabCount:value});}\n  function updateContourTabWidth(event:Event){if(operation.kind!=='contour')return;const value=Number((event.currentTarget as HTMLInputElement).value);if(Number.isFinite(value)&&value>0)updateContour({tabWidthMm:value});}\n  function updateContourTabHeight(event:Event){if(operation.kind!=='contour')return;const value=Number((event.currentTarget as HTMLInputElement).value);if(Number.isFinite(value)&&value>0)updateContour({tabHeightMm:value});}\n"
            assert anchor in s; s=s.replace(anchor,add,1)
            marker="{:else if operation.kind==='pocket'}"
            i=s.index(marker)
            ui="<div class=\"placement-section\"><p class=\"placement-title\">Haltestege</p><div class=\"placement-grid two\"><button class:active={!(operation.tabsEnabled??false)} onclick={()=>updateContour({tabsEnabled:false})}>Aus</button><button class:active={operation.tabsEnabled??false} onclick={()=>updateContour({tabsEnabled:true})}>Aktiv</button></div>{#if operation.tabsEnabled??false}<label>Anzahl <input type=\"number\" min=\"1\" step=\"1\" value={operation.tabCount??4} oninput={updateContourTabCount}/></label><label>Breite <input type=\"number\" min=\"0.1\" step=\"0.5\" value={operation.tabWidthMm??6} oninput={updateContourTabWidth}/> mm</label><label>Resthöhe <input type=\"number\" min=\"0.1\" step=\"0.1\" value={operation.tabHeightMm??1.5} oninput={updateContourTabHeight}/> mm</label><p class=\"note\">Haltestege werden gleichmäßig entlang geschlossener Konturen verteilt und nur in den tiefen Zustellungen stehen gelassen.</p>{/if}</div>"
            s=s[:i]+ui+s[i:]; p.write_text(s)

          p=Path('package.json'); import json
          j=json.loads(p.read_text()); j['scripts']['check:004i']='node scripts/check-004i-contracts.mjs'; p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')

          Path('scripts/check-004i-contracts.mjs').write_text("""import fs from 'node:fs';
const read=p=>fs.readFileSync(p,'utf8');const assert=(c,m)=>{console.log(`${c?'PASS':'FAIL'} 004I: ${m}`);if(!c)process.exitCode=1;};
const types=read('src/lib/types.ts'),tabs=read('src/lib/contourTabs.ts'),dxf=read('src/lib/gcode.ts'),step=read('src/lib/stepContourOperation.ts'),app=read('src/App.svelte');
assert(types.includes('tabsEnabled?:boolean')&&types.includes('tabCount?:number')&&types.includes('tabWidthMm?:number')&&types.includes('tabHeightMm?:number'),'contour operation owns tab contract');
assert(types.includes('tabsEnabled:false,tabCount:4,tabWidthMm:6,tabHeightMm:1.5'),'defaults are backward compatible and tabs are opt-in');
assert(tabs.includes('applyContourTabs')&&tabs.includes("operation.topology!=='closed'")&&tabs.includes('finalDepthMm-cfg.heightMm'),'shared transformer enforces closed contours and remaining tab height');
assert(dxf.includes('applyContourTabs(canonical'),'DXF canonical contour uses shared tab transformer');
assert(step.includes('applyContourTabs(baseToolpath'),'STEP canonical contour uses shared tab transformer');
assert(app.includes('Haltestege')&&app.includes('updateContourTabCount')&&app.includes('tabHeightMm'),'Bearbeiten UI exposes tab controls');
if(process.exitCode)process.exit(process.exitCode);
""")
          Path('docs/BUILD-004I-CONTOUR-TABS.md').write_text("""# Build 004I — Haltestege / Tabs

## Ziel
Geschlossene DXF- und STEP-Konturen können beim Durchtrennen Reststege stehen lassen, damit das Werkstück sicher im Rohling bleibt.

## Vertrag
`ContourOperation` besitzt opt-in `tabsEnabled` sowie `tabCount`, `tabWidthMm` und `tabHeightMm`. Default: aus, 4 Stück, 6 mm breit, 1,5 mm Resthöhe.

## Gemeinsame Wahrheit
DXF und STEP laufen nach der jeweiligen Konturgeometrie durch denselben `applyContourTabs()`-Transformer auf dem Canonical Contour Toolpath.

## Verhalten
Oberhalb der Tab-Resthöhe bleiben Zustellungen unverändert. Tiefere Zustellungen werden an gleichmäßig verteilten Tab-Fenstern auf die Resthöhe angehoben. Offene Konturen werden fail-closed abgewiesen.

## Scope 004I
Die erste robuste Version verteilt Tabs automatisch gleichmäßig. Manuelles Verschieben einzelner Tabs ist ein späteres UX-Upgrade; die Fertigungssemantik ist bereits operation-owned.
""")
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/stepContourOperation.ts src/App.svelte package.json scripts/check-004i-contracts.mjs docs/BUILD-004I-CONTOUR-TABS.md
          git commit -m '004i-patch: connect tabs to STEP and Bearbeiten UI'
          git push origin HEAD:agent/beblog-cam-004i-contour-tabs
