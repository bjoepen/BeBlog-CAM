name: 004Z-D view cache patch
on:
  push:
    branches: [build/004z-step-contour-target-contract]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/004z-step-contour-target-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-004z-d-view-hooks.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/GeometryView.svelte src/lib/curvedViewCache.ts scripts/check-004z-contracts.mjs
          git commit -m "perf 004Z-D: cache curved geometry across camera updates"
          git push origin HEAD:build/004z-step-contour-target-contract
