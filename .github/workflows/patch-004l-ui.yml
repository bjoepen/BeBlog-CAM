name: Patch 004L UI

on:
  push:
    branches: [agent/beblog-cam-004l-contour-finish-pass]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch 004L inspector and gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path=Path('src/App.svelte')
          app=app_path.read_text()

          handler_anchor="  function updateContourLeadOutLength(event:Event){if(operation.kind!=='contour')return;const value=Number((event.currentTarget as HTMLInputElement).value);if(Number.isFinite(value)&&value>0)updateContour({leadOutLengthMm:value});}\n"
          handlers=handler_anchor+"  function updateContourRadialAllowance(event:Event){if(operation.kind!=='contour')return;const value=Number((event.currentTarget as HTMLInputElement).value);if(Number.isFinite(value)&&value>=0)updateContour({radialAllowanceMm:value});}\n  function updateContourAxialAllowance(event:Event){if(operation.kind!=='contour')return;const value=Number((event.currentTarget as HTMLInputElement).value);if(Number.isFinite(value)&&value>=0)updateContour({axialAllowanceMm:value});}\n  function updateContourFinishPassCount(event:Event){if(operation.kind!=='contour')return;const value=Math.floor(Number((event.currentTarget as HTMLInputElement).value));if(Number.isFinite(value)&&value>=1)updateContour({finishPassCount:value});}\n"
          if 'function updateContourRadialAllowance' not in app:
              if handler_anchor not in app: raise SystemExit('004L handler anchor missing')
              app=app.replace(handler_anchor,handlers,1)

          ui_anchor='<div class="placement-section"><p class="placement-title">Ein-/Ausfahrt</p>'
          finishing='<div class="placement-section"><p class="placement-title">Aufmaß & Schlichten</p><label>Radiales Aufmaß <input type="number" min="0" step="0.05" value={operation.radialAllowanceMm??0} oninput={updateContourRadialAllowance}/> mm</label><label>Axiales Aufmaß <input type="number" min="0" step="0.05" value={operation.axialAllowanceMm??0} oninput={updateContourAxialAllowance}/> mm</label><div class="placement-grid two"><button class:active={!(operation.finishPassEnabled??false)} onclick={()=>updateContour({finishPassEnabled:false})}>Nur Schruppen</button><button class:active={operation.finishPassEnabled??false} onclick={()=>updateContour({finishPassEnabled:true})}>Schlichten</button></div>{#if operation.finishPassEnabled??false}<label>Schlichtdurchgänge <input type="number" min="1" step="1" value={operation.finishPassCount??1} oninput={updateContourFinishPassCount}/></label><p class="note">Der Schruppgang lässt radial und axial das definierte Aufmaß stehen. Danach fährt der Schlichtdurchgang die nominale Kontur auf Sollmaß; weitere Durchgänge dienen als Wiederhol-/Spring-Pass.</p>{:else if (operation.radialAllowanceMm??0)>0||(operation.axialAllowanceMm??0)>0}<p class="note"><strong>Aufmaß bleibt stehen:</strong> Ohne Schlichtdurchgang wird das definierte Material bewusst nicht auf Sollmaß entfernt.</p>{:else}<p class="note">Kein Aufmaß und kein separater Schlichtdurchgang aktiv.</p>{/if}</div>'
          if 'Aufmaß & Schlichten' not in app:
              if ui_anchor not in app: raise SystemExit('004L UI anchor missing')
              app=app.replace(ui_anchor,finishing+ui_anchor,1)
          app_path.write_text(app)

          gate_path=Path('scripts/check-004l-contracts.mjs')
          gate=gate_path.read_text()
          if "const app=read('src/App.svelte');" not in gate:
              gate=gate.replace("const step=read('src/lib/stepContourOperation.ts');\n","const step=read('src/lib/stepContourOperation.ts');\nconst app=read('src/App.svelte');\n",1)
          marker="  ['004L rejects radial allowance on on-line contours',finishing.includes(\"operation.side==='on-line'\")],\n"
          ui_checks=marker+"  ['004L inspector exposes radial and axial allowance',app.includes('Aufmaß & Schlichten')&&app.includes('updateContourRadialAllowance')&&app.includes('updateContourAxialAllowance')],\n  ['004L inspector exposes finish-pass controls',app.includes('finishPassEnabled:true')&&app.includes('updateContourFinishPassCount')&&app.includes('Schlichtdurchgänge')],\n"
          if '004L inspector exposes radial and axial allowance' not in gate:
              if marker not in gate: raise SystemExit('004L gate anchor missing')
              gate=gate.replace(marker,ui_checks,1)
          gate_path.write_text(gate)
          PY
      - name: Commit product patch and remove helper workflow
        run: |
          rm -f .github/workflows/patch-004l-ui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(004l): expose contour allowance and finish controls'
          git push origin HEAD:agent/beblog-cam-004l-contour-finish-pass
