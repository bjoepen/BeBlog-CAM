name: Fix 004P preflight guard
on:
  push:
    branches: [agent/beblog-cam-004p-stock-simulation]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004p-stock-simulation
          fetch-depth: 0
      - shell: bash
        run: |
          git show 531282226961ecb50838a5cda2a8ab0f24a9fb60:src/App.svelte > src/App.svelte
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.svelte'); s=p.read_text()
          old="{:else if activeStep==='Prüfen'}<p class=\"eyebrow\">05 · Prüfen</p><h2>Job prüfen</h2><JobPreflightPanel summary={importSummary} {stock} {stockMode} {placement} {orientation} {wcs} operations={operationsProject.operations}/>{#if stockMode==='none'}<p class=\"note\">Stock-Simulation ist ohne definierten Rohling nicht verfügbar.</p>{:else if wcs.z!=='top'}<p class=\"note\">Stock-Simulation 004P ist aktuell nur mit Z-Null auf Rohlingoberseite verfügbar.</p>{:else}<div class=\"placement-section\"><p class=\"placement-title\">Reststock-Simulation</p><p class=\"note\">Die 2.5D-Heightfield-Simulation wird im Job-Preflight aus allen akzeptierten kanonischen Werkzeugwegen in Bearbeitungsreihenfolge aufgebaut.</p><dl><div><dt>Status</dt><dd>Im Preflight aktiv</dd></div><div><dt>Basis</dt><dd>Rohling {stock.width.toFixed(1)} × {stock.height.toFixed(1)} × {stock.thickness.toFixed(1)} mm</dd></div><div><dt>Operationen</dt><dd>{operationsProject.operations.filter(op=>op.enabled!==false).length} aktiv</dd></div><div><dt>Modell</dt><dd>2.5D Heightfield · Werkzeugradius-Sweep</dd></div></dl></div>{/if}"
          new="{:else if activeStep==='Prüfen'}{#if importSummary}<p class=\"eyebrow\">05 · Prüfen</p><h2>Job prüfen</h2><JobPreflightPanel summary={importSummary} {stock} {stockMode} {placement} {orientation} {wcs} operations={operationsProject.operations}/>{#if stockMode==='none'}<p class=\"note\">Stock-Simulation ist ohne definierten Rohling nicht verfügbar.</p>{:else if wcs.z!=='top'}<p class=\"note\">Stock-Simulation 004P ist aktuell nur mit Z-Null auf Rohlingoberseite verfügbar.</p>{:else}<div class=\"placement-section\"><p class=\"placement-title\">Reststock-Simulation</p><p class=\"note\">Die 2.5D-Heightfield-Simulation wird im Job-Preflight aus allen akzeptierten kanonischen Werkzeugwegen in Bearbeitungsreihenfolge aufgebaut.</p><dl><div><dt>Status</dt><dd>Im Preflight aktiv</dd></div><div><dt>Basis</dt><dd>Rohling {stock.width.toFixed(1)} × {stock.height.toFixed(1)} × {stock.thickness.toFixed(1)} mm</dd></div><div><dt>Operationen</dt><dd>{operationsProject.operations.filter(op=>op.enabled!==false).length} aktiv</dd></div><div><dt>Modell</dt><dd>2.5D Heightfield · Werkzeugradius-Sweep</dd></div></dl></div>{/if}{:else}<p class=\"eyebrow\">05 · Prüfen</p><h2>Preflight</h2><p>Noch kein Bauteil geladen.</p>{/if}"
          if old not in s: raise SystemExit('004P Prüfen block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('scripts/check-004p-contracts.mjs'); s=p.read_text()
          if 'Prüfen UI guards nullable import summary' not in s:
            marker="  ['Prüfen UI exposes the 004P rest-stock summary',app.includes('Reststock-Simulation')&&app.includes('2.5D Heightfield')&&app.includes('Stock-Simulation 004P ist aktuell nur mit Z-Null auf Rohlingoberseite verfügbar.')],\n"
            addition=marker+"  ['Prüfen UI guards nullable import summary',app.includes(\"{:else if activeStep==='Prüfen'}{#if importSummary}\")&&app.includes('<JobPreflightPanel summary={importSummary}')],\n"
            if marker not in s: raise SystemExit('004P UI gate anchor not found')
            s=s.replace(marker,addition,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.svelte scripts/check-004p-contracts.mjs
          git commit -m "fix(004p): guard preflight UI import summary"
          git push
