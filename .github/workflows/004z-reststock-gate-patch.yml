name: 004Z reststock gate patch
on:
  push:
    branches: [build/004z-step-contour-target-contract]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: build/004z-step-contour-target-contract}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/patch-004z-reststock-gate.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check-004z-contracts.mjs
          git commit -m "test 004Z: gate automatic rest-stock contour start"
          git push origin HEAD:build/004z-step-contour-target-contract
