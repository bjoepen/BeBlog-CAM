name: Patch 004P top-Z guard
on:
  push:
    branches: [agent/beblog-cam-004p-stock-simulation]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004p-stock-simulation
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/jobPreflight.ts'); s=p.read_text()
          old="const simulation=stockMode==='none'?null:simulateStockHeightfield({stock,wcs,operations:stockSimulationOperations});if(simulation){errors.push(...simulation.errors.map(e=>`Stock-Simulation: ${e}`));warnings.push(...simulation.warnings.map(w=>`Stock-Simulation: ${w}`));}"
          new="const simulation=stockMode==='none'||wcs.z!=='top'?null:simulateStockHeightfield({stock,wcs,operations:stockSimulationOperations});if(stockMode!=='none'&&wcs.z!=='top')warnings.push('Stock-Simulation 004P ist bei Z-Null auf Rohlingunterseite noch nicht verfügbar.');if(simulation){errors.push(...simulation.errors.map(e=>`Stock-Simulation: ${e}`));warnings.push(...simulation.warnings.map(w=>`Stock-Simulation: ${w}`));}"
          if old not in s: raise SystemExit('004P top-Z anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/jobPreflight.ts
          git diff --cached --quiet || git commit -m "fix(004p): skip unsupported bottom-Z stock simulation"
          git push
