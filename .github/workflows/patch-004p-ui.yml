name: Patch 004P UI
on:
  push:
    branches: [agent/beblog-cam-004p-stock-simulation]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004p-stock-simulation
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.svelte'); s=p.read_text()
          anchor="{:else if activeStep==='Fräsen'}"
          block="{:else if activeStep==='Prüfen'}<p class=\"eyebrow\">05 · Prüfen</p><h2>Job prüfen</h2><JobPreflightPanel summary={importSummary} {stock} {stockMode} {placement} {orientation} {wcs} operations={operationsProject.operations}/>{#if stockMode==='none'}<p class=\"note\">Stock-Simulation ist ohne definierten Rohling nicht verfügbar.</p>{:else if wcs.z!=='top'}<p class=\"note\">Stock-Simulation 004P ist aktuell nur mit Z-Null auf Rohlingoberseite verfügbar.</p>{:else}<div class=\"placement-section\"><p class=\"placement-title\">Reststock-Simulation</p><p class=\"note\">Die 2.5D-Heightfield-Simulation wird im Job-Preflight aus allen akzeptierten kanonischen Werkzeugwegen in Bearbeitungsreihenfolge aufgebaut.</p><dl><div><dt>Status</dt><dd>Im Preflight aktiv</dd></div><div><dt>Basis</dt><dd>Rohling {stock.width.toFixed(1)} × {stock.height.toFixed(1)} × {stock.thickness.toFixed(1)} mm</dd></div><div><dt>Operationen</dt><dd>{operationsProject.operations.filter(op=>op.enabled!==false).length} aktiv</dd></div><div><dt>Modell</dt><dd>2.5D Heightfield · Werkzeugradius-Sweep</dd></div></dl></div>{/if}\n"+anchor
          start="{:else if activeStep==='Prüfen'}"
          if start not in s: raise SystemExit('004P Prüfen anchor not found')
          a=s.index(start); b=s.index(anchor,a)
          s=s[:a]+block+s[b+len(anchor):]
          p.write_text(s)

          p=Path('scripts/check-004p-contracts.mjs'); s=p.read_text()
          if "const app=read('src/App.svelte');" not in s:
            s=s.replace("const pkg=read('package.json');", "const pkg=read('package.json');\nconst app=read('src/App.svelte');")
          ui_check="  ['Prüfen UI exposes the 004P rest-stock summary',app.includes('Reststock-Simulation')&&app.includes('2.5D Heightfield')&&app.includes('Stock-Simulation 004P ist aktuell nur mit Z-Null auf Rohlingoberseite verfügbar.')],\n"
          if 'Prüfen UI exposes the 004P rest-stock summary' not in s:
            marker='];\nlet failed='
            if marker not in s: raise SystemExit('004P gate terminator not found')
            s=s.replace(marker,ui_check+'];\nlet failed=',1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.svelte scripts/check-004p-contracts.mjs
          git diff --cached --quiet || git commit -m "feat(004p): expose stock simulation in preflight UI"
          git push
