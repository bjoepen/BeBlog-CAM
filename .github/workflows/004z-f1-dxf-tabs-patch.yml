name: 004Z-F1 DXF tabs patch
on:
  push:
    branches: [build/004z-step-contour-target-contract]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/004z-step-contour-target-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-004z-f1-dxf-tabs.mjs
      - run: node scripts/check-004z-contracts.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/jobPreflight.ts scripts/check-004z-contracts.mjs
          git commit -m "fix 004Z-F1: unify DXF tabs on canonical XYZ contract"
          git push origin HEAD:build/004z-step-contour-target-contract
