name: Fix 006B narrowing

on:
  push:
    branches: [build/006b-dxf-multi-target]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/006b-dxf-multi-target
      - name: Fix exhaustive narrowing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/ContourOverlay.svelte')
          s=p.read_text()
          old="operation.kind==='facing'||operation.kind==='z-level-roughing'||operation.kind==='surface-finishing'?operation.kind:(operation.kind==='carve'||operation.kind==='drill')?operation.curveIds.join(','):(operation.kind==='contour'||operation.kind==='pocket')?normalizeDxfTargetIds(operation).join(','):operation.kind,"
          new="operation.kind==='facing'||operation.kind==='z-level-roughing'||operation.kind==='surface-finishing'?operation.kind:(operation.kind==='carve'||operation.kind==='drill')?operation.curveIds.join(','):normalizeDxfTargetIds(operation).join(','),"
          if s.count(old)!=1:
              raise SystemExit(f'expected one narrowing expression, found {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ContourOverlay.svelte
          git commit -m "fix 006b: resolve exhaustive operation narrowing"
          git push origin HEAD:build/006b-dxf-multi-target
