name: 004Z-B island semantics patch
on:
  push:
    branches: [build/004z-step-contour-target-contract]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/004z-step-contour-target-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-004z-b-island-semantics.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/types.ts src/lib/faceTargetRoughing.ts src/lib/faceTargetOperation.ts src/lib/zLevelOperationState.ts src/App.svelte src/lib/operationsProject.ts src/lib/jobPreflight.ts scripts/check-004z-contracts.mjs
          git commit -m "feat 004Z-B: make face-target islands explicit"
          git push origin HEAD:build/004z-step-contour-target-contract
