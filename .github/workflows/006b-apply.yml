name: Apply 006B DXF Multi Target

on:
  push:
    branches:
      - 'build/006b-dxf-multi-target'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/006b-dxf-multi-target
      - name: Apply 006B patch
        run: |
          python3 scripts/apply-006b.py
          git restore --source=HEAD -- .github/workflows/ci.yml .github/workflows/006b-apply.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build 006b: add DXF multi-target operations"
          git push origin HEAD:build/006b-dxf-multi-target
