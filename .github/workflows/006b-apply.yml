## Motion-Truth

Die einzelnen Ziele werden mit den bereits freigegebenen Single-Target-Builders erzeugt und anschließend **vor** 004T zu einem operationseigenen Canonical Toolpath zusammengeführt.

Damit gilt weiterhin:

