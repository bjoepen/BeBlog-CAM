name: Apply 006B DXF Multi Target

on:
  push:
    branches:
      - 'build/006b-dxf-multi-target'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/006b-dxf-multi-target
      - name: Smoke
        run: echo "006B apply workflow is valid" > /tmp/006b-smoke.txt
