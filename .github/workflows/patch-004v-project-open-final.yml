name: Patch 004V project open final
on:
  push:
    branches:
      - hotfix/004v-project-open-regression
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/004v-project-open-regression
          fetch-depth: 0
      - run: python scripts/patch-004v-project-open-final.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.svelte
          git commit -m "fix(004v): restore project open button in inspector"
          git push
