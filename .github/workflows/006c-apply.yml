name: Apply 006C
on:
  push:
    branches: [build/006c-pocket-through-cut-allowance]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/006c-pocket-through-cut-allowance
      - name: Apply 006C
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def rep(path, old, new):
              p=Path(path); s=p.read_text();
              if old not in s: raise SystemExit(f'pattern missing: {path}: {old[:80]}')
              p.write_text(s.replace(old,new,1))
          rep('src/lib/types.ts', "strategy:PocketStrategy;}", "strategy:PocketStrategy;throughCutAllowanceMm?:number;}")
          rep('src/lib/types.ts', "strategy:'auto',totalDepthMm:3", "strategy:'auto',throughCutAllowanceMm:0,totalDepthMm:3")
          p=Path('src/lib/pocketOperationState.ts'); s=p.read_text()
          s=s.replace("const {summary,operation}=args,errors:string[]=[],warnings:string[]=[];", "const {summary,operation}=args,errors:string[]=[],warnings:string[]=[];\n  const throughCutAllowance=Math.max(0,Number(operation.throughCutAllowanceMm??0));\n  const effectiveDepthMm=summary.kind==='dxf'?operation.totalDepthMm+throughCutAllowance:operation.totalDepthMm;\n  const depthOperation:PocketOperation=throughCutAllowance>EPS&&summary.kind==='dxf'?{...operation,totalDepthMm:effectiveDepthMm}:operation;")
          s=s.replace("const nominalOperation:PocketOperation={...operation,radialAllowanceMm:0", "const nominalOperation:PocketOperation={...depthOperation,radialAllowanceMm:0")
          s=s.replace("const targetDepthMm=nominal.targetDepthMm;", "const targetDepthMm=nominal.targetDepthMm;\n  if(throughCutAllowance>EPS&&summary.kind==='dxf')warnings.push(`Durchfräszugabe aktiv: ${throughCutAllowance.toFixed(3)} mm · effektive Endtiefe ${effectiveDepthMm.toFixed(3)} mm.`);\n  if(throughCutAllowance>1)warnings.push('Durchfräszugabe über 1,000 mm prüfen: Opferplatte und Aufspannung beachten.');")
          s=s.replace("const roughOperation:PocketOperation={...operation,tool:", "const roughOperation:PocketOperation={...depthOperation,tool:")
          p.write_text(s)
          p=Path('src/App.svelte'); s=p.read_text()
          needle="function updatePocket(patch:Partial<PocketOperation>){if(operation.kind!=='pocket')return;setOperation({...operation,...patch});}"
          repl=needle+"\n  function updatePocketThroughCutAllowance(event:Event){if(operation.kind!=='pocket')return;const value=Number((event.currentTarget as HTMLInputElement).value);if(Number.isFinite(value)&&value>=0)updatePocket({throughCutAllowanceMm:value});}"
          if needle not in s: raise SystemExit('App function anchor missing')
          s=s.replace(needle,repl,1)
          # Insert control next to the pocket depth control by finding the first pocket-specific stepover field.
          anchor="<label>Stepover <input type=\"number\" min=\"1\" max=\"95\" bind:value={operation.stepoverPercent} oninput={(e)=>updatePocket({stepoverPercent:Number(e.currentTarget.value)})}/> %</label>"
          control="<label>Durchfräszugabe <input type=\"number\" min=\"0\" step=\"0.05\" value={operation.throughCutAllowanceMm??0} oninput={updatePocketThroughCutAllowance}/> mm</label><small>Optionaler Z-Zuschlag unter die nominelle Taschentiefe, z. B. 0,15 mm zum sicheren Durchfräsen.</small>"
          if anchor in s: s=s.replace(anchor,control+anchor,1)
          else:
              # robust fallback: inject immediately after pocket branch marker
              marker="{:else if operation.kind==='pocket'}"
              if marker not in s: raise SystemExit('Pocket UI anchor missing')
              s=s.replace(marker,marker+control,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/types.ts src/lib/pocketOperationState.ts src/App.svelte
          git commit -m 'build 006c: add pocket through-cut allowance'
          git push origin HEAD:build/006c-pocket-through-cut-allowance
