name: CI

on:
  push:
    branches:
      - agent/beblog-cam-004j-explicit-step-selection

permissions:
  contents: write

jobs:
  apply-004j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 004J
        run: python3 scripts/patch-004j.py
      - name: Restore CI definition and commit
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml src/lib/stepContourOperation.ts src/lib/stepPocketOperation.ts src/lib/stepDrillOperation.ts src/lib/stepEdgeView.ts src/lib/GeometryView.svelte src/App.svelte src/app.css package.json scripts/check-004j-contracts.mjs docs/BUILD-004J-EXPLICIT-STEP-SELECTION.md
          git commit -m '004j-patch: require and expose explicit STEP selection'
          git push origin HEAD:agent/beblog-cam-004j-explicit-step-selection
