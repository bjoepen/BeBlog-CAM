name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Svelte check
        run: pnpm check
      - name: Drill completeness contract
        run: pnpm check:004w
      - name: Unified geometry placement contract
        run: pnpm check:004x
      - name: Pocket completeness contract
        run: pnpm check:004y
      - name: STEP contour completeness contract
        run: pnpm check:004z
      - name: Safe motion contract
        run: pnpm check:004t
      - name: Initial job safe entry contract
        run: pnpm check:004t-entry
      - name: Initial job safe entry sequence
        run: pnpm check:004t-entry-fixture
      - name: Job preview contract
        run: pnpm check:005a
      - name: Simple job simulation contract
        run: pnpm check:005b
      - name: Job simulation inspector contract
        run: pnpm check:005c
      - name: Estlcam production contract
        run: pnpm check:006a
      - name: DXF multi-target contract
        run: pnpm check:006b
      - name: Pocket through-cut allowance contract
        run: pnpm check:006c
      - name: STEP surface carve projection contract
        run: pnpm check:007a
      - name: Surface carve canonical motion contract
        run: pnpm check:007b
      - name: Surface Carve operation contract
        run: pnpm check:007c
      - name: Surface Carve Bearbeiten product slice contract
        run: pnpm check:007d
      - name: Surface Carve projection integration contract
        run: pnpm check:007e
      - name: Frontend build
        run: pnpm build
      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
