name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Svelte check
        run: pnpm check
      - name: Drill completeness contract
        run: pnpm check:004w
      - name: Unified geometry placement contract
        run: pnpm check:004x
      - name: Pocket completeness contract
        run: pnpm check:004y
      - name: STEP contour completeness contract
        run: pnpm check:004z
      - name: Frontend build
        run: pnpm build
      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
