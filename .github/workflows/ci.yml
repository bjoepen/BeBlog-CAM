name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Svelte check
        run: pnpm check
      - name: Drill completeness contract
        run: pnpm check:004w
      - name: Unified geometry placement contract
        run: pnpm check:004x
      - name: Pocket completeness contract
        run: pnpm check:004y
      - name: STEP contour completeness contract
        run: pnpm check:004z
      - name: Safe motion contract
        run: pnpm check:004t
      - name: Initial job safe entry contract
        run: pnpm check:004t-entry
      - name: Initial job safe entry sequence
        run: pnpm check:004t-entry-fixture
      - name: Job preview contract
        run: pnpm check:005a
      - name: Simple job simulation contract
        run: pnpm check:005b
      - name: Job simulation inspector contract
        run: pnpm check:005c
      - name: Estlcam production contract
        run: pnpm check:006a
      - name: DXF multi-target contract
        run: pnpm check:006b
      - name: Pocket through-cut allowance contract
        run: pnpm check:006c
      - name: STEP surface carve projection contract
        run: pnpm check:007a
      - name: Surface carve canonical motion contract
        run: pnpm check:007b
      - name: Surface Carve cleanup contract
        run: pnpm check:007f
      - name: Production acceptance baseline
        run: pnpm check:008a
      - name: Production acceptance harness
        run: pnpm check:008a1
      - name: Synthetic 2D production acceptance
        run: pnpm check:008a2
      - name: Multi-operation production acceptance
        run: pnpm check:008a4
      - name: Estlcam multi-operation contract
        run: pnpm check:008a5
      - name: Project save/load acceptance
        run: pnpm check:008b1
      - name: Project fail-closed acceptance
        run: pnpm check:008b2
      - name: Project source recovery contract
        run: pnpm check:008b3
      - name: Project source recovery integration
        run: pnpm check:008b3b
      - name: Project source change contract
        run: pnpm check:008b4
      - name: Project reference-integrity contract
        run: pnpm check:008b5
      - name: Atomic project save contract
        run: pnpm check:008b6
      - name: Project reload determinism contract
        run: pnpm check:008b7
      - name: Estlcam qualification baseline
        run: pnpm check:008c1
      - name: 3D roughing level eligibility contract
        run: pnpm check:008h-a4
      - name: 3D roughing material connectivity contract
        run: pnpm check:008h-a5
      - name: 3D roughing safe chains contract
        run: pnpm check:008h-a6
      - name: 3D roughing canonical safe-edge contract
        run: pnpm check:008h-a7
      - name: 3D roughing Z-level schedule contract
        run: pnpm check:008h-a8
      - name: 3D roughing multi-level canonical contract
        run: pnpm check:008h-a9
      - name: 3D roughing pipeline orchestration contract
        run: pnpm check:008h-a10
      - name: 3D roughing manufacturing release contract
        run: pnpm check:008h-a11
      - name: 3D roughing editing integration contract
        run: pnpm check:008h-a12
      - name: 3D roughing coordinate-space integration contract
        run: pnpm check:008h-a13
      - name: 3D roughing part-aware cutter safety contract
        run: pnpm check:008h-a14
      - name: 3D roughing direction and eligibility-domain contract
        run: pnpm check:008h-a15
      - name: Frontend build
        run: pnpm build
      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
