name: 004J targeted patch
on:
  push:
    branches: [agent/beblog-cam-004j-explicit-step-selection]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '004j-patch:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004j-explicit-step-selection
      - name: Patch explicit STEP selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          # Core: contour must be explicit.
          p=Path('src/lib/stepContourOperation.ts'); s=p.read_text()
          old="const all=candidates(summary);if(!all.length)errors.push('Keine geschlossene horizontale STEP-Wire als Konturkandidat erkannt.');const chosen=operation.stepWireId==null?all[0]??null:all.find(c=>c.wireId===operation.stepWireId)??null;if(operation.stepWireId!=null&&!chosen)errors.push('Gewählte STEP-Wire ist nicht mehr als Konturkandidat verfügbar.');if(operation.stepWireId==null&&chosen)warnings.push(`Keine STEP-Wire explizit gewählt: größte obere geschlossene Wire ${chosen.wireId} wird verwendet.`);if(errors.length||!chosen)return{ok:false,toolpath:null,errors,warnings,candidates:all,selected:chosen};"
          new="const all=candidates(summary);if(!all.length)errors.push('Keine geschlossene horizontale STEP-Wire als Konturkandidat erkannt.');if(operation.stepWireId==null)errors.push('Keine STEP-Kontur explizit gewählt. Wähle eine geschlossene Wire im Viewport.');const chosen=operation.stepWireId==null?null:all.find(c=>c.wireId===operation.stepWireId)??null;if(operation.stepWireId!=null&&!chosen)errors.push('Gewählte STEP-Wire ist nicht mehr als Konturkandidat verfügbar.');if(errors.length||!chosen)return{ok:false,toolpath:null,errors,warnings,candidates:all,selected:chosen};"
          assert old in s, 'contour fallback anchor missing'; p.write_text(s.replace(old,new,1))

          # Core: pocket must be explicit.
          p=Path('src/lib/stepPocketOperation.ts'); s=p.read_text()
          old="const belowTop=all.filter(c=>b&&c.zMm<b.maxZ-EPS);const selectedPool=belowTop.length?belowTop:all;const chosen=operation.stepFaceId==null?selectedPool[0]??null:selectedPool.find(c=>c.faceId===operation.stepFaceId)??null;if(operation.stepFaceId!=null&&!chosen)errors.push('Gewählte STEP-Face ist nicht mehr als Taschenregion verfügbar.');if(operation.stepFaceId==null&&chosen)warnings.push(`Keine STEP-Face explizit gewählt: obere innere planare Face ${chosen.faceId} wird verwendet.`);if(errors.length||!chosen||!b)return{ok:false,toolpath:null,errors,warnings,candidates:all,selected:chosen,targetDepthMm:null};"
          new="const belowTop=all.filter(c=>b&&c.zMm<b.maxZ-EPS);const selectedPool=belowTop.length?belowTop:all;if(operation.stepFaceId==null)errors.push('Keine STEP-Taschenfläche explizit gewählt. Wähle eine planare Face im Viewport.');const chosen=operation.stepFaceId==null?null:selectedPool.find(c=>c.faceId===operation.stepFaceId)??null;if(operation.stepFaceId!=null&&!chosen)errors.push('Gewählte STEP-Face ist nicht mehr als Taschenregion verfügbar.');if(errors.length||!chosen||!b)return{ok:false,toolpath:null,errors,warnings,candidates:all,selected:chosen,targetDepthMm:null};"
          assert old in s, 'pocket fallback anchor missing'; p.write_text(s.replace(old,new,1))

          # Core: drill must be explicit.
          p=Path('src/lib/stepDrillOperation.ts'); s=p.read_text()
          old="const requestedIds=operation.stepHoleFeatureIds??[];\n  const selectedIds=requestedIds.length?requestedIds:recognized.holes.map(h=>h.featureId);"
          new="const requestedIds=operation.stepHoleFeatureIds??[];\n  if(!requestedIds.length)errors.push('Keine STEP-Bohrung explizit gewählt. Wähle mindestens eine erkannte Bohrung im Viewport.');\n  const selectedIds=requestedIds;"
          assert old in s, 'drill fallback anchor missing'; s=s.replace(old,new,1)
          s=s.replace("  if(!requestedIds.length&&holes.length)warnings.push(`Keine Teilmenge gewählt: alle ${holes.length} sicher erkannten STEP-Bohrungen werden bearbeitet.`);\n","")
          p.write_text(s)

          # Keep display edge index as BRep edge id for picking.
          p=Path('src/lib/stepEdgeView.ts'); s=p.read_text()
          s=s.replace("export type StepEdge3={points:number[]};","export type StepEdge3={edgeId:number;points:number[]};")
          s=s.replace("return raw.filter(edge=>Array.isArray(edge)&&edge.length>=6&&edge.length%3===0).map(points=>({points}));","return raw.map((points,edgeId)=>({edgeId,points})).filter(edge=>Array.isArray(edge.points)&&edge.points.length>=6&&edge.points.length%3===0);")
          p.write_text(s)

          # GeometryView: STEP face/edge picking.
          p=Path('src/lib/GeometryView.svelte'); s=p.read_text()
          s=s.replace("import type { Curve2, ImportSummary, Point2, StockDefinition, StockMode, PartPlacement, PartOrientation, WorkCoordinateSystem, ZLevelRoughingOperation, SurfaceFinishingOperation } from './types';","import type { Curve2, ImportSummary, Point2, StockDefinition, StockMode, PartPlacement, PartOrientation, WorkCoordinateSystem, ZLevelRoughingOperation, SurfaceFinishingOperation, ContourOperation, PocketOperation, DrillOperation } from './types';")
          anchor="  import { buildModelRoughingCanonicalToolpath } from './modelRoughingToolpath';\n"
          assert anchor in s
          s=s.replace(anchor,anchor+"  import { buildStepManufacturingFeatureSource } from './stepManufacturingFeatures';\n  import { recognizeStepHoles } from './stepHoleRecognition';\n  import { buildStepContourOperationState } from './stepContourOperation';\n  import { buildStepPocketOperationState } from './stepPocketOperation';\n",1)
          anchor="  export let onFaceTargetChange:(state:{toolpath:CanonicalToolpath;targetZ:number;roughBottomZ:number}|null)=>void=()=>{};\n"
          add=anchor+"  export let stepSelectionOperation:ContourOperation|PocketOperation|DrillOperation|null=null;\n  export let onStepWireIdChange:(wireId:number|null)=>void=()=>{};\n  export let onStepFaceIdChange:(faceId:number|null)=>void=()=>{};\n  export let onStepHoleFeatureIdsChange:(featureIds:string[])=>void=()=>{};\n"
          assert anchor in s; s=s.replace(anchor,add,1)
          anchor="  $: selectableSurfaceEditing=faceTargetEditing||surfaceFinishingEditing;\n"
          add=anchor+"  $: stepFeatureSourceResult=summary.kind==='step'?buildStepManufacturingFeatureSource(summary):null;\n  $: stepHoleCandidates=stepFeatureSourceResult?.ok?recognizeStepHoles(stepFeatureSourceResult.source).holes:[];\n  $: stepContourSelection=stepSelectionOperation?.kind==='contour'?buildStepContourOperationState({summary,stock,stockMode,placement,orientation,wcs,operation:stepSelectionOperation}):null;\n  $: stepPocketSelection=stepSelectionOperation?.kind==='pocket'?buildStepPocketOperationState({summary,stock,stockMode,placement,orientation,wcs,operation:stepSelectionOperation}):null;\n"
          assert anchor in s; s=s.replace(anchor,add,1)
          old="const edgeWorld=decodeStepEdges(summary.brep?.displayEdges).map(edge=>{const points:P3[]=[];for(let i=0;i+2<edge.points.length;i+=3)points.push(place3(rotate3({x:edge.points[i],y:edge.points[i+1],z:edge.points[i+2]})));return points}).filter(edge=>edge.length>=2);"
          new="const edgeWorld=decodeStepEdges(summary.brep?.displayEdges).map(edge=>{const points:P3[]=[];for(let i=0;i+2<edge.points.length;i+=3)points.push(place3(rotate3({x:edge.points[i],y:edge.points[i+1],z:edge.points[i+2]})));return{edgeId:edge.edgeId,points}}).filter(edge=>edge.points.length>=2);"
          assert old in s; s=s.replace(old,new,1)
          old="const pp=part.map(q=>projectPoint(q,v)),ep=edgeWorld.map(edge=>edge.map(q=>projectPoint(q,v))),"
          new="const pp=part.map(q=>projectPoint(q,v)),ep=edgeWorld.map(edge=>({edgeId:edge.edgeId,points:edge.points.map(q=>projectPoint(q,v))})),"
          assert old in s; s=s.replace(old,new,1)
          s=s.replace("...ep.flat(),","...ep.flatMap(edge=>edge.points),",1)
          old="const triangles=projectTriangles(part,v,map,faceIds),edges=ep.map(edge=>path(edge.map(map))).filter(Boolean);"
          new="const triangles=projectTriangles(part,v,map,faceIds),edges=ep.map(edge=>({edgeId:edge.edgeId,d:path(edge.points.map(map))})).filter(edge=>Boolean(edge.d));"
          assert old in s; s=s.replace(old,new,1)
          anchor="  function toggleFace(faceId:number){if(!selectableSurfaceEditing||(!surfaceFinishingEditing&&!showZLevels)||dragMoved||!s3?.facePickingAvailable)return;const next=(selectedFaceIds.includes(faceId)?selectedFaceIds.filter(id=>id!==faceId):[...selectedFaceIds,faceId]).sort((a,b)=>a-b);onSelectedFaceIdsChange(next)}\n"
          replacement="  function stepFaceSelectable(faceId:number){if(!stepSelectionOperation)return false;if(stepSelectionOperation.kind==='pocket')return !!stepPocketSelection?.candidates.some(c=>c.faceId===faceId);if(stepSelectionOperation.kind==='drill')return stepHoleCandidates.some(h=>h.faceIds.includes(faceId));return false;}\n  function stepFaceSelected(faceId:number){if(!stepSelectionOperation)return false;if(stepSelectionOperation.kind==='pocket')return stepSelectionOperation.stepFaceId===faceId;if(stepSelectionOperation.kind==='drill')return stepHoleCandidates.some(h=>h.faceIds.includes(faceId)&&(stepSelectionOperation.stepHoleFeatureIds??[]).includes(h.featureId));return false;}\n  function toggleFace(faceId:number){if(dragMoved||!s3?.facePickingAvailable)return;if(stepSelectionOperation&&stepFaceSelectable(faceId)){if(stepSelectionOperation.kind==='pocket'){onStepFaceIdChange(stepSelectionOperation.stepFaceId===faceId?null:faceId);return;}if(stepSelectionOperation.kind==='drill'){const hole=stepHoleCandidates.find(h=>h.faceIds.includes(faceId));if(!hole)return;const set=new Set(stepSelectionOperation.stepHoleFeatureIds??[]);set.has(hole.featureId)?set.delete(hole.featureId):set.add(hole.featureId);onStepHoleFeatureIdsChange([...set].sort());return;}}if(!selectableSurfaceEditing||(!surfaceFinishingEditing&&!showZLevels))return;const next=(selectedFaceIds.includes(faceId)?selectedFaceIds.filter(id=>id!==faceId):[...selectedFaceIds,faceId]).sort((a,b)=>a-b);onSelectedFaceIdsChange(next)}\n  function stepEdgeSelectable(edgeId:number){if(stepSelectionOperation?.kind!=='contour'||!stepContourSelection)return false;const source=stepFeatureSourceResult?.ok?stepFeatureSourceResult.source:null;if(!source)return false;const candidateIds=new Set(stepContourSelection.candidates.map(c=>c.wireId));let matches=0;for(const wires of source.wiresByFace.values())for(const wire of wires)if(candidateIds.has(wire.wireId)&&wire.edgeIds.includes(edgeId))matches++;return matches===1;}\n  function toggleStepEdge(edgeId:number){if(dragMoved||stepSelectionOperation?.kind!=='contour'||!stepContourSelection)return;const source=stepFeatureSourceResult?.ok?stepFeatureSourceResult.source:null;if(!source)return;const candidateIds=new Set(stepContourSelection.candidates.map(c=>c.wireId));const ids:number[]=[];for(const wires of source.wiresByFace.values())for(const wire of wires)if(candidateIds.has(wire.wireId)&&wire.edgeIds.includes(edgeId)&&!ids.includes(wire.wireId))ids.push(wire.wireId);if(ids.length===1)onStepWireIdChange(stepSelectionOperation.stepWireId===ids[0]?null:ids[0]);}\n"
          assert anchor in s; s=s.replace(anchor,replacement,1)
          old="class:selectable-face={selectableSurfaceEditing&&(surfaceFinishingEditing||showZLevels)&&s3.facePickingAvailable} class:selected-face={selectedFaceIds.includes(triangle.faceId)} style={`fill:${faceFill(triangle.shade,selectedFaceIds.includes(triangle.faceId))}`} role={selectableSurfaceEditing&&(surfaceFinishingEditing||showZLevels)&&s3.facePickingAvailable?'button':undefined}"
          new="class:selectable-face={(stepFaceSelectable(triangle.faceId)||selectableSurfaceEditing&&(surfaceFinishingEditing||showZLevels))&&s3.facePickingAvailable} class:selected-face={stepFaceSelected(triangle.faceId)||selectedFaceIds.includes(triangle.faceId)} style={`fill:${faceFill(triangle.shade,stepFaceSelected(triangle.faceId)||selectedFaceIds.includes(triangle.faceId))}`} role={(stepFaceSelectable(triangle.faceId)||selectableSurfaceEditing&&(surfaceFinishingEditing||showZLevels))&&s3.facePickingAvailable?'button':undefined}"
          assert old in s; s=s.replace(old,new,1)
          old="{#each s3.edges as edge}<path d={edge} class=\"step-edge\"/>{/each}"
          new="{#each s3.edges as edge}<path d={edge.d} class=\"step-edge\" class:selectable-step-edge={stepEdgeSelectable(edge.edgeId)} class:selected-step-edge={stepSelectionOperation?.kind==='contour'&&stepSelectionOperation.stepWireId!=null&&stepFeatureSourceResult?.ok&&[...stepFeatureSourceResult.source.wiresByFace.values()].flat().some(w=>w.wireId===stepSelectionOperation!.stepWireId&&w.edgeIds.includes(edge.edgeId))} role={stepEdgeSelectable(edge.edgeId)?'button':undefined} tabindex=\"-1\" onclick={()=>toggleStepEdge(edge.edgeId)}><title>Kante {edge.edgeId+1}</title></path>{/each}"
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)

          # CSS for selectable STEP edges.
          p=Path('src/app.css'); s=p.read_text()
          if '.selectable-step-edge' not in s:
            s += "\n.selectable-step-edge{cursor:pointer;stroke-width:2.2}.selectable-step-edge:hover{stroke-width:3.4}.selected-step-edge{stroke-width:4;stroke-dasharray:7 3}\n"
          p.write_text(s)

          # App: wire the STEP selection operation into GeometryView and show explicit status.
          p=Path('src/App.svelte'); s=p.read_text()
          old="surfaceFinishingOperation={activeStep==='Bearbeiten'&&operation.kind==='surface-finishing'?operation:null} selectedFaceIds="
          new="surfaceFinishingOperation={activeStep==='Bearbeiten'&&operation.kind==='surface-finishing'?operation:null} stepSelectionOperation={activeStep==='Bearbeiten'&&importSummary.kind==='step'&&(operation.kind==='contour'||operation.kind==='pocket'||operation.kind==='drill')?operation:null} onStepWireIdChange={(wireId)=>operation.kind==='contour'&&updateContour({stepWireId:wireId})} onStepFaceIdChange={(faceId)=>operation.kind==='pocket'&&updatePocket({stepFaceId:faceId})} onStepHoleFeatureIdsChange={(featureIds)=>operation.kind==='drill'&&updateDrill({stepHoleFeatureIds:featureIds})} selectedFaceIds="
          assert old in s, 'GeometryView App anchor missing'; s=s.replace(old,new,1)
          old="{:else if operation.kind==='drill'}<p>{importSummary.kind==='dxf'?'Wähle native DXF-Kreise als Bohrungen. Der Kreis definiert Mittelpunkt und Soll-Durchmesser; danach wählst du das Herstellungsverfahren.':'Bohrauswahl aus STEP folgt später.'}</p>{#if importSummary.kind==='dxf'}"
          new="{:else if operation.kind==='drill'}<p>{importSummary.kind==='dxf'?'Wähle native DXF-Kreise als Bohrungen. Der Kreis definiert Mittelpunkt und Soll-Durchmesser; danach wählst du das Herstellungsverfahren.':'Klicke die sicher erkannten zylindrischen Bohrungsflächen im STEP-Viewport an. Nur explizit markierte Bohrungen werden bearbeitet.'}</p>{#if importSummary.kind==='step'}<p class=\"note\"><strong>STEP-Auswahl:</strong> {operation.stepHoleFeatureIds?.length??0} Bohrung{(operation.stepHoleFeatureIds?.length??0)===1?'':'en'} explizit gewählt.</p>{/if}{#if importSummary.kind==='dxf'}"
          assert old in s; s=s.replace(old,new,1)
          old="{:else if operation.kind==='contour'||operation.kind==='pocket'}<p>{importSummary.kind==='dxf'?'Klicke im Viewport auf eine geschlossene Kontur.':'Die 2D-Auswahl aus STEP folgt später.'}</p>{#if importSummary.kind==='dxf'}<p class=\"note\"><strong>Ziel:</strong> {operation.contourId===null?'Noch keine geschlossene Kontur gewählt.':`Kontur ${operation.contourId+1} gewählt.`}</p>{/if}{/if}"
          new="{:else if operation.kind==='contour'||operation.kind==='pocket'}<p>{importSummary.kind==='dxf'?'Klicke im Viewport auf eine geschlossene Kontur.':operation.kind==='contour'?'Klicke eine eindeutig zuordenbare Kante der gewünschten geschlossenen STEP-Wire.':'Klicke die planare STEP-Face, die als Taschenboden bearbeitet werden soll.'}</p>{#if importSummary.kind==='dxf'}<p class=\"note\"><strong>Ziel:</strong> {operation.contourId===null?'Noch keine geschlossene Kontur gewählt.':`Kontur ${operation.contourId+1} gewählt.`}</p>{:else if operation.kind==='contour'}<p class=\"note\"><strong>STEP-Ziel:</strong> {operation.stepWireId==null?'Noch keine Wire explizit gewählt.':`Wire ${operation.stepWireId} gewählt.`}</p>{:else}<p class=\"note\"><strong>STEP-Ziel:</strong> {operation.stepFaceId==null?'Noch keine Taschen-Face explizit gewählt.':`Face ${operation.stepFaceId} gewählt.`}</p>{/if}{/if}"
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)

          # Contract gate + docs + package script.
          p=Path('package.json'); j=json.loads(p.read_text()); j['scripts']['check:004j']='node scripts/check-004j-contracts.mjs'; p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          Path('scripts/check-004j-contracts.mjs').write_text("""import fs from 'node:fs';
const read=p=>fs.readFileSync(p,'utf8');const assert=(c,m)=>{console.log(`${c?'PASS':'FAIL'} 004J: ${m}`);if(!c)process.exitCode=1;};
const contour=read('src/lib/stepContourOperation.ts'),pocket=read('src/lib/stepPocketOperation.ts'),drill=read('src/lib/stepDrillOperation.ts'),view=read('src/lib/GeometryView.svelte'),app=read('src/App.svelte'),edge=read('src/lib/stepEdgeView.ts');
assert(contour.includes('Keine STEP-Kontur explizit gewählt')&&!contour.includes('größte obere geschlossene Wire'),'STEP contour fails closed without explicit wire');
assert(pocket.includes('Keine STEP-Taschenfläche explizit gewählt')&&!pocket.includes('obere innere planare Face'),'STEP pocket fails closed without explicit face');
assert(drill.includes('Keine STEP-Bohrung explizit gewählt')&&drill.includes('const selectedIds=requestedIds;'),'STEP drill fails closed without explicit hole set');
assert(edge.includes('edgeId:number')&&view.includes('toggleStepEdge')&&view.includes('stepEdgeSelectable'),'STEP contour supports explicit edge-to-wire picking');
assert(view.includes('stepFaceSelectable')&&view.includes('onStepHoleFeatureIdsChange')&&view.includes('onStepFaceIdChange'),'STEP pocket and drill support face picking');
assert(app.includes('stepSelectionOperation=')&&app.includes('Noch keine Wire explizit gewählt')&&app.includes('Bohrung{(operation.stepHoleFeatureIds'),'Bearbeiten UI exposes explicit STEP selection state');
if(process.exitCode)process.exit(process.exitCode);
""")
          Path('docs/BUILD-004J-EXPLICIT-STEP-SELECTION.md').write_text("""# Build 004J — Explizite STEP-Geometrieauswahl

## Ziel
Kein STEP-Werkzeugweg darf mehr aus einer stillen automatischen Geometriewahl entstehen.

## Sicherheitsvertrag
- Kontur: `stepWireId` muss explizit gewählt sein.
- Tasche: `stepFaceId` muss explizit gewählt sein.
- Bohren/Helix: `stepHoleFeatureIds` muss mindestens eine explizit gewählte erkannte Bohrung enthalten.
- Fehlende oder veraltete Auswahl führt fail-closed zu keinem Toolpath.

## Viewport
- Taschen werden über planare BRep-Faces gewählt.
- Bohrungen werden über die konservativ erkannten zylindrischen Hole-Faces gewählt; Mehrfachauswahl ist möglich.
- Konturen werden über BRep-Kanten gewählt. Eine Kante ist nur anklickbar, wenn sie eindeutig genau einer gültigen geschlossenen Kontur-Wire zugeordnet werden kann.

## Ergebnis
Die bisherige Übergangslogik „größte obere Wire“, „obere innere Face“ bzw. „alle erkannten Bohrungen“ ist nicht mehr produktionswirksam.
""")
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/stepContourOperation.ts src/lib/stepPocketOperation.ts src/lib/stepDrillOperation.ts src/lib/stepEdgeView.ts src/lib/GeometryView.svelte src/App.svelte src/app.css package.json scripts/check-004j-contracts.mjs docs/BUILD-004J-EXPLICIT-STEP-SELECTION.md
          git commit -m '004j-patch: require and expose explicit STEP selection'
          git push origin HEAD:agent/beblog-cam-004j-explicit-step-selection
