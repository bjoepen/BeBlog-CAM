name: Patch 004N core
on:
  push:
    branches: [agent/beblog-cam-004n-rest-machining]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004n-rest-machining
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/types.ts'); s=p.read_text()
          s=s.replace("export interface PocketOperation extends BaseOperation{kind:'pocket';contourId:number|null;stepFaceId?:number|null;direction:CutDirection;stepoverPercent:number;entry:PocketEntry;rampAngleDeg:number;strategy:PocketStrategy;}","export interface PocketOperation extends BaseOperation{kind:'pocket';contourId:number|null;stepFaceId?:number|null;restMachiningEnabled?:boolean;restFromOperationId?:string|null;direction:CutDirection;stepoverPercent:number;entry:PocketEntry;rampAngleDeg:number;strategy:PocketStrategy;}")
          s=s.replace("stepFaceId:null,tool:{id:'tool-1'","stepFaceId:null,restMachiningEnabled:false,restFromOperationId:null,tool:{id:'tool-1'")
          p.write_text(s)

          p=Path('src/lib/jobGcode.ts'); s=p.read_text()
          s=s.replace("import { buildStepPocketOperationState } from './stepPocketOperation';", "import { buildStepPocketOperationState } from './stepPocketOperation';\nimport { buildPocketCanonicalToolpath, postPocketCanonicalToolpath } from './pocketCanonicalToolpath';\nimport { applyPocketRestMachining } from './pocketRestMachining';")
          old="""  if(operation.kind==='pocket'){\n    const pocket=operation as PocketOperation;\n    if(args.summary.kind==='step'){const r=generateStepPocketGcode({...common,operation:pocket});return{...r,code:normalizeGcodeComments(r.code)};}\n    const result=generatePocketGcode({...common,operation:pocket});if(!result.ok)return result;const optimized=optimizeParallelPocketStayDown(result.code,pocket);return{...result,code:normalizeGcodeComments(optimized.code)};\n  }"""
          new="""  if(operation.kind==='pocket'){\n    const pocket=operation as PocketOperation;\n    if(pocket.restMachiningEnabled){\n      const currentIndex=args.operations.findIndex(op=>op.id===pocket.id),sourceIndex=args.operations.findIndex(op=>op.id===pocket.restFromOperationId),source=sourceIndex>=0?args.operations[sourceIndex]:null;\n      if(!source||source.kind!=='pocket')return{ok:false,errors:['Restmaterial benötigt eine gültige vorherige Taschenbearbeitung.'],warnings:[],code:''};\n      if(sourceIndex>=currentIndex)return{ok:false,errors:['Restmaterialquelle muss im Job vor der aktuellen Taschenbearbeitung liegen.'],warnings:[],code:''};\n      if(source.tool.diameterMm<=pocket.tool.diameterMm)return{ok:false,errors:['Restmaterial benötigt ein kleineres Folgewerkzeug als die vorherige Taschenbearbeitung.'],warnings:[],code:''};\n      const build=(op:PocketOperation)=>{if(args.summary.kind==='step'){const state=buildStepPocketOperationState({...common,operation:op});return state.ok?state.toolpath:null;}return buildPocketCanonicalToolpath({...common,operation:op});};\n      const previous=build(source),current=build(pocket);if(!previous||!current)return{ok:false,errors:['Restmaterial konnte die kanonischen Taschenbahnen nicht rekonstruieren.'],warnings:[],code:''};\n      const rest=applyPocketRestMachining({current,previous,currentToolDiameterMm:pocket.tool.diameterMm,previousToolDiameterMm:source.tool.diameterMm});if(rest.errors.length)return{ok:false,errors:rest.errors,warnings:rest.warnings,code:''};\n      if(!rest.toolpath)return{ok:true,errors:[],warnings:rest.warnings,code:'( BeBlog CAM 004N )\\n( Kein Restmaterial vorhanden )\\nG21\\nG90\\nG17\\nM30\\n'};\n      const code=postPocketCanonicalToolpath(rest.toolpath,{safeZMm:pocket.safeZMm,feedMmMin:pocket.feedMmMin,plungeMmMin:pocket.plungeMmMin,spindleRpm:pocket.spindleRpm});return{ok:true,errors:[],warnings:rest.warnings,code:normalizeGcodeComments(code)};\n    }\n    if(args.summary.kind==='step'){const r=generateStepPocketGcode({...common,operation:pocket});return{...r,code:normalizeGcodeComments(r.code)};}\n    const result=generatePocketGcode({...common,operation:pocket});if(!result.ok)return result;const optimized=optimizeParallelPocketStayDown(result.code,pocket);return{...result,code:normalizeGcodeComments(optimized.code)};\n  }"""
          if old not in s: raise SystemExit('job pocket anchor not found')
          s=s.replace(old,new)
          p.write_text(s)

          p=Path('package.json'); s=p.read_text(); s=s.replace('"check:004m": "node scripts/check-004m-contracts.mjs",','"check:004m": "node scripts/check-004m-contracts.mjs",\n    "check:004n": "node scripts/check-004n-contracts.mjs",'); p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/types.ts src/lib/jobGcode.ts package.json
          git commit -m "feat(004n): integrate rest machining into pocket jobs"
          git push
