name: 004Z solid visible-face self-patch

on:
  push:
    branches: [build/004z-step-contour-target-contract]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/004z-step-contour-target-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply solid visible-face patch
        run: node scripts/apply-004z-solid-visible-picking.mjs
      - name: Commit patched source
        run: |
          if git diff --quiet -- src/lib/GeometryView.svelte; then
            echo "No solid visible-face patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/GeometryView.svelte
          git commit -m "fix 004Z: make STEP viewport solid and visibility-picked"
          git push origin HEAD:build/004z-step-contour-target-contract
