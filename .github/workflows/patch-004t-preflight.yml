name: Patch 004T preflight
on:
  push:
    branches:
      - agent/beblog-cam-004t-safe-motion-chain
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004t-safe-motion-chain
          fetch-depth: 0
      - name: Apply 004T preflight integration
        run: python scripts/patch-004t-preflight.py
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/jobPreflight.ts scripts/check-004t-contracts.mjs
          git commit -m "feat(004t): materialize safe motions in job preflight"
          git push
