name: Fix 004U check errors
on:
  push:
    branches:
      - agent/beblog-cam-004u-spindle-collision
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004u-spindle-collision
          fetch-depth: 0
      - run: python scripts/fix-004u-check-errors.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/jobPreflight.ts
          git commit -m "fix(004u): repair preflight integration"
          git push
