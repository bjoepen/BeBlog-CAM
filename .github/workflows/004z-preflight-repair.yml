name: 004Z preflight repair
on:
  push:
    branches: [build/004z-step-contour-target-contract]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/004z-step-contour-target-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/repair-004z-preflight.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/jobPreflight.ts
          git commit -m "fix 004Z: connect preflight contour to prior rest stock"
          git push origin HEAD:build/004z-step-contour-target-contract
