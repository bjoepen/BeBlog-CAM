name: Patch 004Q integration
on:
  push:
    branches: [agent/beblog-cam-004q-holder-collision-preflight]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004q-holder-collision-preflight
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # types.ts: persist assembly geometry on operation tool assignment.
          p=Path('src/lib/types.ts'); s=p.read_text()
          s=s.replace("export interface ToolDefinition{id:string;name:string;diameterMm:number;kind?:MillingToolKind;}","export interface ToolDefinition{id:string;name:string;diameterMm:number;kind?:MillingToolKind;cuttingLengthMm?:number;stickoutMm?:number;shaftDiameterMm?:number;holderDiameterMm?:number;}")
          def tool(old,new):
            global s
            if old not in s: raise SystemExit(f'tool default anchor missing: {old}')
            s=s.replace(old,new,1)
          tool("tool:{id:'tool-face-1',name:'Planfräser 20 mm',diameterMm:20,kind:'face-mill'}","tool:{id:'tool-face-1',name:'Planfräser 20 mm',diameterMm:20,kind:'face-mill',cuttingLengthMm:5,stickoutMm:20,shaftDiameterMm:20,holderDiameterMm:25}")
          tool("tool:{id:'tool-1',name:'Schaftfräser 3 mm',diameterMm:3,kind:'end-mill'}","tool:{id:'tool-1',name:'Schaftfräser 3 mm',diameterMm:3,kind:'end-mill',cuttingLengthMm:12,stickoutMm:20,shaftDiameterMm:3,holderDiameterMm:20}")
          # same literal appears for pocket after first replacement
          tool("tool:{id:'tool-1',name:'Schaftfräser 3 mm',diameterMm:3,kind:'end-mill'}","tool:{id:'tool-1',name:'Schaftfräser 3 mm',diameterMm:3,kind:'end-mill',cuttingLengthMm:12,stickoutMm:20,shaftDiameterMm:3,holderDiameterMm:20}")
          tool("tool:{id:'tool-carve-1',name:'Schaftfräser 0,6 mm',diameterMm:.6,kind:'end-mill'}","tool:{id:'tool-carve-1',name:'Schaftfräser 0,6 mm',diameterMm:.6,kind:'end-mill',cuttingLengthMm:4,stickoutMm:15,shaftDiameterMm:3,holderDiameterMm:20}")
          tool("tool:{id:'tool-drill-1',name:'Bohrer 3 mm',diameterMm:3}","tool:{id:'tool-drill-1',name:'Bohrer 3 mm',diameterMm:3,cuttingLengthMm:20,stickoutMm:25,shaftDiameterMm:3,holderDiameterMm:20}")
          tool("tool:{id:'tool-finish-1',name:'Vollradiusfräser 3 mm',diameterMm:3,kind:'ball-nose'}","tool:{id:'tool-finish-1',name:'Vollradiusfräser 3 mm',diameterMm:3,kind:'ball-nose',cuttingLengthMm:12,stickoutMm:25,shaftDiameterMm:3,holderDiameterMm:20}")
          tool("tool:{id:'tool-roughing-1',name:'Schaftfräser 6 mm',diameterMm:6,kind:'end-mill'}","tool:{id:'tool-roughing-1',name:'Schaftfräser 6 mm',diameterMm:6,kind:'end-mill',cuttingLengthMm:15,stickoutMm:25,shaftDiameterMm:6,holderDiameterMm:20}")
          p.write_text(s)

          # ToolPanel.svelte: send assembly fields with operation transfer.
          p=Path('src/lib/ToolPanel.svelte'); s=p.read_text()
          old="type ToolOperationTransfer={operationId:string;toolId:string;toolName:string;toolKind:MillingToolKind;diameterMm:number;feedMmMin:number;spindleRpm:number};"
          new="type ToolOperationTransfer={operationId:string;toolId:string;toolName:string;toolKind:MillingToolKind;diameterMm:number;feedMmMin:number;spindleRpm:number;cuttingLengthMm:number;stickoutMm:number;shaftDiameterMm:number;holderDiameterMm:number};"
          if old not in s: raise SystemExit('ToolOperationTransfer anchor missing')
          s=s.replace(old,new,1)
          old="onApplyToOperation({operationId:targetOperationId,toolId:selectedToolId??'tool-calculator',toolName:tool.name.trim()||millingToolLabels[tool.kind],toolKind:tool.kind,diameterMm:calculationDiameter,feedMmMin:Math.round(recommendedFeed),spindleRpm:Math.round(recommendedRpm)});"
          new="onApplyToOperation({operationId:targetOperationId,toolId:selectedToolId??'tool-calculator',toolName:tool.name.trim()||millingToolLabels[tool.kind],toolKind:tool.kind,diameterMm:calculationDiameter,feedMmMin:Math.round(recommendedFeed),spindleRpm:Math.round(recommendedRpm),cuttingLengthMm:tool.kind==='end-mill'||tool.kind==='ball-nose'?tool.cuttingLengthMm:(tool.kind==='face-mill'?tool.maxDepthOfCutMm:tool.stickoutMm),stickoutMm:tool.stickoutMm,shaftDiameterMm:tool.kind==='end-mill'||tool.kind==='ball-nose'?tool.shaftDiameterMm:calculationDiameter,holderDiameterMm:tool.holderDiameterMm});"
          if old not in s: raise SystemExit('apply transfer anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # App.svelte: accept and persist the transferred geometry.
          p=Path('src/App.svelte'); s=p.read_text()
          old="function applyToolOperationTransfer(transfer:{operationId:string;toolId:string;toolName:string;toolKind:MillingToolKind;diameterMm:number;feedMmMin:number;spindleRpm:number}){"
          new="function applyToolOperationTransfer(transfer:{operationId:string;toolId:string;toolName:string;toolKind:MillingToolKind;diameterMm:number;feedMmMin:number;spindleRpm:number;cuttingLengthMm:number;stickoutMm:number;shaftDiameterMm:number;holderDiameterMm:number}){"
          if old not in s: raise SystemExit('App transfer signature anchor missing')
          s=s.replace(old,new,1)
          old="tool:{id:transfer.toolId,name:transfer.toolName,diameterMm:transfer.diameterMm,kind:transfer.toolKind}"
          new="tool:{id:transfer.toolId,name:transfer.toolName,diameterMm:transfer.diameterMm,kind:transfer.toolKind,cuttingLengthMm:transfer.cuttingLengthMm,stickoutMm:transfer.stickoutMm,shaftDiameterMm:transfer.shaftDiameterMm,holderDiameterMm:transfer.holderDiameterMm}"
          if old not in s: raise SystemExit('App tool assignment anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          # jobPreflight.ts: apply collision check against previous accepted stock state before adding current cut.
          p=Path('src/lib/jobPreflight.ts'); s=p.read_text()
          imp="import { validateToolAssemblyAgainstRestStock } from './toolAssemblyCollision';\n"
          if imp not in s:
            anchor="import { simulateStockHeightfield, type StockSimulationOperation } from './stockSimulation';\n"
            if anchor not in s: raise SystemExit('job preflight import anchor missing')
            s=s.replace(anchor,anchor+imp,1)
          anchor="    const canonical=validateCanonicalToolpath(canonicalToolpath);if(!opErrors.length){opErrors.push(...canonical.errors.map(message=>`Kanonischer Werkzeugweg: ${message}`));opWarnings.push(...canonical.warnings.map(message=>`Kanonischer Werkzeugweg: ${message}`));}\n"
          insert=anchor+"    if(canonicalToolpath&&!opErrors.length&&stockMode!=='none'&&wcs.z==='top'){const t=operation.tool;if(t.cuttingLengthMm&&t.stickoutMm&&t.shaftDiameterMm&&t.holderDiameterMm){const holder=validateToolAssemblyAgainstRestStock({stock,wcs,previousOperations:stockSimulationOperations,toolpath:canonicalToolpath,assembly:{cuttingLengthMm:t.cuttingLengthMm,stickoutMm:t.stickoutMm,shankDiameterMm:t.shaftDiameterMm,holderDiameterMm:t.holderDiameterMm}});opErrors.push(...holder.errors.map(message=>`Werkzeugbaugruppe: ${message}`));opWarnings.push(...holder.warnings.map(message=>`Werkzeugbaugruppe: ${message}`));detail+=` · 004Q Halter Ø ${t.holderDiameterMm.toFixed(1)} mm · Auskragung ${t.stickoutMm.toFixed(1)} mm`;}else opWarnings.push('Werkzeugbaugruppe: Für 004Q fehlen Schneidenlänge, Auskragung, Schaft- oder Halterdurchmesser.');}\n"
          if 'Werkzeugbaugruppe: Für 004Q fehlen' not in s:
            if anchor not in s: raise SystemExit('job preflight canonical anchor missing')
            s=s.replace(anchor,insert,1)
          p.write_text(s)

          # Gate: integration must remain contractual.
          p=Path('scripts/check-004q-contracts.mjs'); s=p.read_text()
          if "const types=read('src/lib/types.ts');" not in s:
            s=s.replace("const stock=read('src/lib/stockSimulation.ts');\n", "const stock=read('src/lib/stockSimulation.ts');\nconst types=read('src/lib/types.ts');\nconst preflight=read('src/lib/jobPreflight.ts');\nconst tools=read('src/lib/ToolPanel.svelte');\nconst app=read('src/App.svelte');\n")
          marker="  ['package exposes local-first 004Q gate',pkg.includes('\"check:004q\": \"node scripts/check-004q-contracts.mjs\"')],\n"
          addition="  ['operation tool assignment persists holder geometry',types.includes('stickoutMm?:number')&&types.includes('holderDiameterMm?:number')],\n  ['tool panel transfers holder geometry into operations',tools.includes('holderDiameterMm:tool.holderDiameterMm')&&tools.includes('stickoutMm:tool.stickoutMm')],\n  ['app persists transferred assembly geometry',app.includes('holderDiameterMm:transfer.holderDiameterMm')&&app.includes('stickoutMm:transfer.stickoutMm')],\n  ['job preflight runs 004Q against previous rest stock',preflight.includes('validateToolAssemblyAgainstRestStock')&&preflight.includes('previousOperations:stockSimulationOperations')&&preflight.includes('Werkzeugbaugruppe:')],\n"+marker
          if 'operation tool assignment persists holder geometry' not in s:
            if marker not in s: raise SystemExit('gate marker missing')
            s=s.replace(marker,addition,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/types.ts src/lib/ToolPanel.svelte src/App.svelte src/lib/jobPreflight.ts scripts/check-004q-contracts.mjs
          git commit -m "feat(004q): integrate holder geometry into job preflight"
          git push
