name: Patch 004U integration 2
on:
  push:
    branches:
      - agent/beblog-cam-004u-spindle-collision
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004u-spindle-collision
          fetch-depth: 0
      - name: Apply 004U integration
        run: python scripts/patch-004u-integration2.py
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.svelte src/lib/jobPreflight.ts src/lib/jobGcode.ts src/lib/JobPreflightPanel.svelte src/lib/JobGCodePanel.svelte scripts/check-004u-contracts.mjs
          git commit -m "feat(004u): integrate spindle head safety into job flow"
          git push
