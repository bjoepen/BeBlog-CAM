name: Patch 004N preflight
on:
  push:
    branches: [agent/beblog-cam-004n-rest-machining]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004n-rest-machining
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/jobPreflight.ts'); s=p.read_text()
          s=s.replace("import { buildStepPocketOperationState } from './stepPocketOperation';", "import { buildStepPocketOperationState } from './stepPocketOperation';\nimport { applyPocketRestMachining } from './pocketRestMachining';")
          anchor="""      else{const r=generatePocketGcode({summary,stock,stockMode,placement,orientation,wcs,operation});opErrors=[...r.errors];opWarnings=[...r.warnings];detail=`Tasche · Ø ${operation.tool.diameterMm.toFixed(3)} mm · ${operation.totalDepthMm.toFixed(3)} mm tief`;if(r.ok)canonicalToolpath=buildPocketCanonicalToolpath({summary,stock,stockMode,placement,orientation,wcs,operation});}\n    }"""
          replacement="""      else{const r=generatePocketGcode({summary,stock,stockMode,placement,orientation,wcs,operation});opErrors=[...r.errors];opWarnings=[...r.warnings];detail=`Tasche · Ø ${operation.tool.diameterMm.toFixed(3)} mm · ${operation.totalDepthMm.toFixed(3)} mm tief`;if(r.ok)canonicalToolpath=buildPocketCanonicalToolpath({summary,stock,stockMode,placement,orientation,wcs,operation});}\n      if(operation.restMachiningEnabled){\n        const currentIndex=enabled.findIndex(op=>op.id===operation.id),sourceIndex=enabled.findIndex(op=>op.id===operation.restFromOperationId),source=sourceIndex>=0?enabled[sourceIndex]:null;\n        if(!source||source.kind!=='pocket')opErrors.push('Restmaterial benötigt eine gültige vorherige Taschenbearbeitung.');\n        else if(sourceIndex>=currentIndex)opErrors.push('Restmaterialquelle muss im Job vor der aktuellen Taschenbearbeitung liegen.');\n        else if(source.tool.diameterMm<=operation.tool.diameterMm)opErrors.push('Restmaterial benötigt ein kleineres Folgewerkzeug als die vorherige Taschenbearbeitung.');\n        else if(summary.kind==='step'&&source.stepFaceId!==operation.stepFaceId)opErrors.push('Restmaterialquelle und Folgeoperation müssen dieselbe STEP-Taschenfläche verwenden.');\n        else if(summary.kind==='dxf'&&source.contourId!==operation.contourId)opErrors.push('Restmaterialquelle und Folgeoperation müssen dieselbe DXF-Taschenkontur verwenden.');\n        else if(canonicalToolpath){\n          const previous=summary.kind==='step'?buildStepPocketOperationState({summary,stock,stockMode,placement,orientation,wcs,operation:source}).toolpath:buildPocketCanonicalToolpath({summary,stock,stockMode,placement,orientation,wcs,operation:source});\n          if(!previous)opErrors.push('Restmaterial konnte die vorherige kanonische Taschenbahn nicht rekonstruieren.');\n          else{const rest=applyPocketRestMachining({current:canonicalToolpath,previous,currentToolDiameterMm:operation.tool.diameterMm,previousToolDiameterMm:source.tool.diameterMm});opErrors.push(...rest.errors);opWarnings.push(...rest.warnings);canonicalToolpath=rest.toolpath;detail+=` · Restmaterial aus ${source.name} · Ø ${source.tool.diameterMm.toFixed(3)} → ${operation.tool.diameterMm.toFixed(3)} mm`;}\n        }\n      }\n    }"""
          if anchor not in s: raise SystemExit('pocket preflight anchor not found')
          s=s.replace(anchor,replacement)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/jobPreflight.ts
          git commit -m "feat(004n): validate rest machining in job preflight"
          git push
