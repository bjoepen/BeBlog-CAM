name: Patch 004V project open button
on:
  push:
    branches:
      - agent/beblog-cam-004v-job-persistence
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004v-job-persistence
          fetch-depth: 0
      - run: python scripts/patch-004v-project-open-button.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.svelte
          git commit -m "fix(004v): restore project open action"
          git push
