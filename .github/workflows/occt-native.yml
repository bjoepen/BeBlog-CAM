name: OCCT Native

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'scripts/build-occt-macos.sh'
      - '.github/workflows/occt-native.yml'
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'scripts/build-occt-macos.sh'
      - '.github/workflows/occt-native.yml'

jobs:
  occt-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned OCCT 8 toolkits
        run: bash scripts/build-occt-macos.sh
      - name: Native STEP/BRep smoke test
        env:
          BEBLOG_OCCT_PREFIX: ${{ github.workspace }}/.cache/occt/install
          BEBLOG_OCCT_TEST_STEP: ${{ github.workspace }}/.cache/occt/src/data/step/screw.step
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/.cache/occt/install/lib
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features occt-native occt::tests::loads_real_step_as_brep -- --exact
