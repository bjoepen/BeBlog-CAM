name: 004Z-E2 ramp patch
on:
  push:
    branches: [build/004z-step-contour-target-contract]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/004z-step-contour-target-contract
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-004z-e2-ramp.mjs
      - run: node scripts/check-004z-contracts.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.svelte src/lib/stepContourOperation.ts scripts/check-004z-contracts.mjs
          git commit -m "feat 004Z-E2: ramp open contours along groove path"
          git push origin HEAD:build/004z-step-contour-target-contract
