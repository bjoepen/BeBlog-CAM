name: 004I UI patch
on:
  push:
    branches: [agent/beblog-cam-004i-contour-tabs]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '004i-ui:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004i-contour-tabs
      - name: Patch App.svelte at stable anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.svelte')
          s=p.read_text()
          if 'updateContourTabCount' in s:
              print('004I UI already present')
              raise SystemExit(0)
          anchor="  function updateContourOvercut(event:Event){if(operation.kind!=='contour')return;const value=Number((event.currentTarget as HTMLInputElement).value);if(Number.isFinite(value)&&value>=0)updateContour({overcutMm:value});}\n"
          add=anchor+"  function updateContourTabCount(event:Event){if(operation.kind!=='contour')return;const value=Math.floor(Number((event.currentTarget as HTMLInputElement).value));if(Number.isFinite(value)&&value>=1)updateContour({tabCount:value});}\n  function updateContourTabWidth(event:Event){if(operation.kind!=='contour')return;const value=Number((event.currentTarget as HTMLInputElement).value);if(Number.isFinite(value)&&value>0)updateContour({tabWidthMm:value});}\n  function updateContourTabHeight(event:Event){if(operation.kind!=='contour')return;const value=Number((event.currentTarget as HTMLInputElement).value);if(Number.isFinite(value)&&value>0)updateContour({tabHeightMm:value});}\n"
          assert anchor in s, 'contour overcut handler anchor missing'
          s=s.replace(anchor,add,1)
          marker="{:else if operation.kind==='pocket'}"
          i=s.index(marker)
          ui="<div class=\"placement-section\"><p class=\"placement-title\">Haltestege</p><div class=\"placement-grid two\"><button class:active={!(operation.tabsEnabled??false)} onclick={()=>updateContour({tabsEnabled:false})}>Aus</button><button class:active={operation.tabsEnabled??false} onclick={()=>updateContour({tabsEnabled:true})}>Aktiv</button></div>{#if operation.tabsEnabled??false}<label>Anzahl <input type=\"number\" min=\"1\" step=\"1\" value={operation.tabCount??4} oninput={updateContourTabCount}/></label><label>Breite <input type=\"number\" min=\"0.1\" step=\"0.5\" value={operation.tabWidthMm??6} oninput={updateContourTabWidth}/> mm</label><label>Resthöhe <input type=\"number\" min=\"0.1\" step=\"0.1\" value={operation.tabHeightMm??1.5} oninput={updateContourTabHeight}/> mm</label><p class=\"note\">Haltestege werden gleichmäßig entlang geschlossener Konturen verteilt und nur in den tiefen Zustellungen stehen gelassen.</p>{/if}</div>"
          s=s[:i]+ui+s[i:]
          p.write_text(s)
          PY
      - name: Commit UI patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.svelte
          git commit -m '004i-ui: expose contour tab controls'
          git push origin HEAD:agent/beblog-cam-004i-contour-tabs
