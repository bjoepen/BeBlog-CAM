name: Patch 004P core
on:
  push:
    branches: [agent/beblog-cam-004p-stock-simulation]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beblog-cam-004p-stock-simulation
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/jobPreflight.ts'); s=p.read_text()
          s=s.replace("import { toolIdentityKey } from './toolIdentity.js';", "import { toolIdentityKey } from './toolIdentity.js';\nimport { simulateStockHeightfield, type StockSimulationOperation } from './stockSimulation';")
          s=s.replace("export type JobPreflightResult={level:JobPreflightLevel;operations:JobPreflightOperation[];enabledCount:number;toolChanges:number;errors:string[];warnings:string[]};", "export type JobPreflightStockSimulation={cellSizeMm:number;columns:number;rows:number;initialVolumeMm3:number;remainingVolumeMm3:number;removedVolumeMm3:number;removedPercent:number;touchedCells:number;operationCount:number};\nexport type JobPreflightResult={level:JobPreflightLevel;operations:JobPreflightOperation[];enabledCount:number;toolChanges:number;errors:string[];warnings:string[];stockSimulation:JobPreflightStockSimulation|null};")
          s=s.replace("const {summary,stock,stockMode,placement,orientation,wcs}=args,enabled=args.operations.filter(op=>op.enabled!==false),operations:JobPreflightOperation[]=[],errors:string[]=[],warnings:string[]=[];", "const {summary,stock,stockMode,placement,orientation,wcs}=args,enabled=args.operations.filter(op=>op.enabled!==false),operations:JobPreflightOperation[]=[],errors:string[]=[],warnings:string[]=[],stockSimulationOperations:StockSimulationOperation[]=[];")
          marker="    opErrors=unique(opErrors);opWarnings=unique(opWarnings);const level:JobPreflightLevel=opErrors.length?'fail':opWarnings.length?'warn':'pass',label=operation.name||kindLabel(operation.kind);operations.push({id:operation.id,index:index+1,kind:operation.kind,label,detail,canonical:canonical.summary,level,errors:opErrors,warnings:opWarnings});errors.push(...opErrors.map(e=>`Bearbeitung ${index+1} (${kindLabel(operation.kind)}): ${e}`));warnings.push(...opWarnings.map(w=>`Bearbeitung ${index+1} (${kindLabel(operation.kind)}): ${w}`));"
          repl="    opErrors=unique(opErrors);opWarnings=unique(opWarnings);if(canonicalToolpath&&!opErrors.length)stockSimulationOperations.push({operationId:operation.id,toolpath:canonicalToolpath});const level:JobPreflightLevel=opErrors.length?'fail':opWarnings.length?'warn':'pass',label=operation.name||kindLabel(operation.kind);operations.push({id:operation.id,index:index+1,kind:operation.kind,label,detail,canonical:canonical.summary,level,errors:opErrors,warnings:opWarnings});errors.push(...opErrors.map(e=>`Bearbeitung ${index+1} (${kindLabel(operation.kind)}): ${e}`));warnings.push(...opWarnings.map(w=>`Bearbeitung ${index+1} (${kindLabel(operation.kind)}): ${w}`));"
          if marker not in s: raise SystemExit('004P preflight op anchor not found')
          s=s.replace(marker,repl,1)
          old="  if(!enabled.length)errors.push('Der Gesamtjob enthält keine aktivierte Bearbeitung.');let toolChanges=0;for(let i=1;i<enabled.length;i++)if(toolKey(enabled[i])!==toolKey(enabled[i-1]))toolChanges++;const level:JobPreflightLevel=errors.length?'fail':warnings.length?'warn':'pass';return{level,operations,enabledCount:enabled.length,toolChanges,errors,warnings};"
          new="  if(!enabled.length)errors.push('Der Gesamtjob enthält keine aktivierte Bearbeitung.');let toolChanges=0;for(let i=1;i<enabled.length;i++)if(toolKey(enabled[i])!==toolKey(enabled[i-1]))toolChanges++;const simulation=stockMode==='none'?null:simulateStockHeightfield({stock,wcs,operations:stockSimulationOperations});if(simulation){errors.push(...simulation.errors.map(e=>`Stock-Simulation: ${e}`));warnings.push(...simulation.warnings.map(w=>`Stock-Simulation: ${w}`));}const stockSimulation=simulation&&simulation.ok?{cellSizeMm:simulation.cellSizeMm,columns:simulation.columns,rows:simulation.rows,initialVolumeMm3:simulation.initialVolumeMm3,remainingVolumeMm3:simulation.remainingVolumeMm3,removedVolumeMm3:simulation.removedVolumeMm3,removedPercent:simulation.removedPercent,touchedCells:simulation.touchedCells,operationCount:simulation.operationCount}:null;const level:JobPreflightLevel=errors.length?'fail':warnings.length?'warn':'pass';return{level,operations,enabledCount:enabled.length,toolChanges,errors,warnings,stockSimulation};"
          if old not in s: raise SystemExit('004P preflight return anchor not found')
          s=s.replace(old,new,1); p.write_text(s)

          p=Path('package.json'); s=p.read_text();
          if '"check:004p"' not in s:
            s=s.replace('"check:004o": "node scripts/check-004o-contracts.mjs",','"check:004o": "node scripts/check-004o-contracts.mjs",\n    "check:004p": "node scripts/check-004p-contracts.mjs",')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/jobPreflight.ts package.json
          git diff --cached --quiet || git commit -m "feat(004p): integrate stock simulation into job preflight"
          git push
